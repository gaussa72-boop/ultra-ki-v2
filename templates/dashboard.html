<!doctype html><html lang="de"><meta charset="utf-8"><title>Ultra KI Dashboard</title><body><h1>Ultra KI V2</h1><p>Willkommen, {{ username }}.</p><div id="messages"></div><form id="chat"><input id="message" required autocomplete="off"><button>Senden</button></form><a href="/logout">Logout</a><script>document.querySelector('#chat').addEventListener('submit',async e=>{e.preventDefault();const i=document.querySelector('#message'),b=document.querySelector('#messages');const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:i.value})});const d=await r.json();b.textContent+=(b.textContent?'\n':'')+'KI: '+(d.reply||d.error);i.value='';});</script></body></html>
